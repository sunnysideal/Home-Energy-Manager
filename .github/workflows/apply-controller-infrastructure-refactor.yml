name: Apply controller infrastructure refactor
on:
  push:
    branches: [refactor/controller-infrastructure]
    paths: ['.github/workflows/apply-controller-infrastructure-refactor.yml']
permissions: {contents: write}
jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: home_energy_manager:home_energy_manager/components/ashp_forecaster/app:home_energy_manager/components/controller
    steps:
      - uses: actions/checkout@v4
        with: {ref: refactor/controller-infrastructure, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Capture exact test failure
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('home_energy_manager/tools/apply_controller_infrastructure_refactor.py'); text=p.read_text()
          old="DB = '''\"\"\"Controller-owned persistence for Home Energy Manager.\"\"\""
          text=text.replace(old,'DB = """# Controller-owned persistence for Home Energy Manager.',1)
          ha=text.index('\n\nHA = '); close=text.rfind("'''",0,ha); text=text[:close]+'"""'+text[close+3:]; p.write_text(text)
          PY
          python home_energy_manager/tools/apply_controller_infrastructure_refactor.py
          cd home_energy_manager
          pip install -q -r requirements.txt pytest pyyaml
          set +e
          pytest -q > ../refactor-test-error.txt 2>&1
          echo "pytest=$?" >> ../refactor-test-error.txt
          set -e
          cd ..
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add refactor-test-error.txt; git commit -m 'Capture repository-environment refactor failure'; git push origin HEAD:refactor/controller-infrastructure
