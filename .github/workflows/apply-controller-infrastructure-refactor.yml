name: Apply controller infrastructure refactor
on:
  push:
    branches: [refactor/controller-infrastructure]
    paths: ['.github/workflows/apply-controller-infrastructure-refactor.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/controller-infrastructure
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Diagnose transformation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('home_energy_manager/tools/apply_controller_infrastructure_refactor.py')
          text=p.read_text()
          start=text.index('DB = ')+len('DB = ')
          text=text[:start]+'"""'+text[start+3:]
          ha=text.index('\n\nHA = ',start)
          close=text.rfind("'''",start,ha)
          text=text[:close]+'"""'+text[close+3:]
          p.write_text(text)
          PY
          set +e
          python -m py_compile home_energy_manager/tools/apply_controller_infrastructure_refactor.py > refactor-error.txt 2>&1
          echo "py_compile=$?" >> refactor-error.txt
          python home_energy_manager/tools/apply_controller_infrastructure_refactor.py >> refactor-error.txt 2>&1
          echo "script=$?" >> refactor-error.txt
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add refactor-error.txt
          git commit -m 'Capture controller refactor diagnostic'
          git push origin HEAD:refactor/controller-infrastructure
