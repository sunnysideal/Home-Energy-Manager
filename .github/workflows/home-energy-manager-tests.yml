name: Home Energy Manager tests

on:
  push:
    paths:
      - 'home_energy_manager/**'
      - '.github/workflows/home-energy-manager-tests.yml'
  pull_request:
    paths:
      - 'home_energy_manager/**'
      - '.github/workflows/home-energy-manager-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: home_energy_manager
    env:
      PYTHONPATH: .:components/ashp_forecaster/app:components/controller
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pyyaml
      - name: Compile Python
        run: |
          python -m compileall -q .
      - name: Run tests
        run: |
          pytest -q
