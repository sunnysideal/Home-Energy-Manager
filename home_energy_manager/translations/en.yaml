configuration:
  energy_strategy:
    name: Energy strategy
    description: Battery-control mode, safety limits, calibration policy and controller timing settings.
    fields:
      operation_mode:
        name: Operation mode
        description: Choose how the controller operates. Use forecast_only for a safe first installation because it forecasts without changing inverter settings.
      safety_buffer_soc:
        name: Safety buffer SOC
        description: Minimum SOC percentage the controller aims to retain for normal operation to reduce the risk of peak-rate grid import.
      axle_entity:
        name: Axle event entity
        description: Package-owned Axle event entity used by the controller. Normally leave this at the default.
      axle_discharge_efficiency:
        name: Axle discharge efficiency
        description: Battery discharge-efficiency factor used when calculating how much stored energy is needed for an Axle export event.
      axle_charge_margin_minutes:
        name: Axle charge margin
        description: Extra minutes allowed before an Axle event when preparing the required battery SOC.
      power_down_enabled:
        name: Enable Power Down events
        description: Enable Power Down event handling. Turn this off if you do not use Power Down events.
      power_down_events_entity:
        name: Power Down events
        description: Optional entity containing Power Down event windows. Leave blank when Power Down is disabled.
      power_down_import_baseline_entity:
        name: Power Down import baseline
        description: Optional entity providing the Power Down import baseline used for event accounting.
      power_down_export_baseline_entity:
        name: Power Down export baseline
        description: Optional entity providing the Power Down export baseline used for event accounting.
      minimise_export_min_soc:
        name: Minimum SOC in minimise export
        description: Minimum battery SOC percentage maintained by minimise_export operation before additional charging is planned.
      calibration_enabled:
        name: Automatic calibration
        description: Enable automatic battery calibration planning. Turn this off to stop scheduled top/full and deep-cycle calibration requests.
      top_full_every_days:
        name: Top calibration interval
        description: Maximum number of days between planned full/top battery calibrations when automatic calibration is enabled.
      deep_cycle_every_days:
        name: Deep calibration interval
        description: Maximum number of days between planned low/deep battery calibrations when automatic calibration is enabled.
      deep_cycle_floor_soc:
        name: Deep calibration floor SOC
        description: Target SOC percentage for a planned low/deep calibration.
      reserve_dwell_minutes:
        name: Low-SOC dwell time
        description: Minutes the battery must remain at the low calibration level before the low endpoint is considered complete.
      export_start:
        name: Preferred export start
        description: Preferred local clock time for evening export planning in modes that schedule generated-energy export.
      preferred_charge_c_rate:
        name: Preferred charge C-rate
        description: Preferred battery charging rate expressed as a fraction of battery capacity per hour.
      max_charge_c_rate:
        name: Maximum charge C-rate
        description: Maximum battery charging C-rate the controller may request when calculating charge power.
      discharge_rate_w:
        name: Controller discharge rate
        description: Requested discharge power in watts for controller-planned export/discharge. A value of 0 allows the controller or inverter default where supported.
      charge_safety_margin_minutes:
        name: Charge safety margin
        description: Extra charging time added to controller calculations so the requested target is reached before the required deadline.
      generic_dwell_minutes:
        name: Generic dwell allowance
        description: Additional dwell allowance in minutes used when no more specific battery completion allowance is available.
      forecast_stale_minutes:
        name: Forecast stale limit
        description: Maximum forecast age in minutes accepted by the controller before it treats the forecast as stale.
      future_tolerance_minutes:
        name: Future-time tolerance
        description: Minutes of tolerance allowed when comparing forecast and controller timestamps around the current time.
      time_deadband_minutes:
        name: Schedule time deadband
        description: Do not rewrite inverter schedule times when the requested change is within this many minutes of the current setting.
      rate_deadband_w:
        name: Power-rate deadband
        description: Do not rewrite inverter charge/discharge rates when the requested change is within this many watts.
      energy_deadband_kwh:
        name: Energy deadband
        description: Ignore very small forecast energy differences below this kWh threshold when deciding whether a plan needs to change.
      charge_variance_threshold_kwh:
        name: Charge variance threshold
        description: kWh threshold used when deciding whether actual charging differs enough from the plan to require replanning.
      export_variance_threshold_kwh:
        name: Export variance threshold
        description: kWh threshold used when deciding whether actual export differs enough from the plan to require replanning.
      write_retry_attempts:
        name: Write retry attempts
        description: Number of attempts made when an inverter setting write does not verify successfully.
      write_retry_delay_seconds:
        name: Write retry delay
        description: Seconds between retries after an inverter setting write fails verification.
      sample_interval_seconds:
        name: Controller sample interval
        description: Seconds between controller observations used for tracking battery behaviour and calibration progress.
      rate_match_tolerance_pct:
        name: Rate match tolerance percent
        description: Percentage tolerance used when comparing requested and observed battery charge/discharge power.
      rate_match_tolerance_w:
        name: Rate match tolerance watts
        description: Absolute watt tolerance used alongside the percentage tolerance when matching observed battery power.
      controller_refresh_timeout_seconds:
        name: Forecast refresh timeout
        description: Maximum seconds the controller waits for a fresh Home Energy Forecast after changing inverter settings.
  battery:
    name: Battery
    description: Battery state and energy measurements used by forecasting, calibration and efficiency learning.
    fields:
      soc:
        name: Battery state of charge
        description: Select the battery SOC entity. Its state must be the current charge level as a percentage from 0 to 100.
      capacity_kwh:
        name: Battery capacity
        description: Select the entity containing usable battery capacity in kWh. Use a capacity value, not current stored energy.
      reserve_soc:
        name: Battery reserve
        description: Select the inverter entity containing the minimum battery reserve in percent. It should match the reserve enforced by the inverter.
      power_w:
        name: Battery power
        description: Optional live battery power entity in watts. Use the signed battery power reported by the inverter integration.
      charge_energy_total_kwh:
        name: Battery charge energy total
        description: Optional cumulative battery charge-energy sensor in kWh. It must increase over time and is used for battery efficiency learning.
      discharge_energy_total_kwh:
        name: Battery discharge energy total
        description: Optional cumulative battery discharge-energy sensor in kWh. It must increase over time and is used for battery efficiency learning.
  grid:
    name: Grid meter
    description: Utility-meter import and export totals. These are preferred because they represent the actual grid boundary.
    fields:
      import_energy_total_kwh:
        name: Grid import energy total
        description: Select the cumulative utility-meter import sensor in kWh. Leave blank only if you need the inverter import total as a fallback.
      export_energy_total_kwh:
        name: Grid export energy total
        description: Select the cumulative utility-meter export sensor in kWh. Leave blank only if you need the inverter export total as a fallback.
  inverter:
    name: Inverter
    description: Inverter load, grid, power-limit and schedule entities used to reproduce and control the battery plan.
    fields:
      house_load_energy_total_kwh:
        name: House load energy total
        description: Select the inverter cumulative house-load energy sensor in kWh. It is used to learn normal household demand.
      import_energy_total_kwh:
        name: Inverter import energy total
        description: Optional cumulative inverter grid-import sensor in kWh. Used only when a utility-meter import entity is not configured.
      export_energy_total_kwh:
        name: Inverter export energy total
        description: Optional cumulative inverter grid-export sensor in kWh. Used only when a utility-meter export entity is not configured.
      max_rate_w:
        name: Maximum battery rate
        description: Select the inverter entity containing the maximum supported battery charge/discharge power in watts.
      charge_rate_w:
        name: Charge rate
        description: Select the inverter setting for scheduled battery charge power in watts. Do not use the live battery power sensor here.
      discharge_rate_w:
        name: Discharge rate
        description: Select the inverter setting for scheduled battery discharge power in watts. Do not use the live battery power sensor here.
      eco_mode:
        name: Eco mode
        description: Select the inverter entity that reports or controls normal self-consumption/Eco mode.
      charge_schedule_enabled:
        name: Charge schedule enabled
        description: Select the inverter switch or status entity that enables scheduled charging.
      discharge_schedule_enabled:
        name: Discharge schedule enabled
        description: Select the inverter switch or status entity that enables scheduled discharging.
      pause_mode:
        name: Pause mode
        description: Select the inverter entity that controls or reports battery pause mode, such as PauseBoth, PauseCharge or PauseDischarge.
      pause_start:
        name: Pause start
        description: Select the inverter entity containing the battery pause-window start time.
      pause_end:
        name: Pause end
        description: Select the inverter entity containing the battery pause-window end time.
      charge_start_1:
        name: Charge slot 1 start
        description: Select the start-time entity for inverter charge slot 1.
      charge_end_1:
        name: Charge slot 1 end
        description: Select the end-time entity for inverter charge slot 1.
      charge_target_1:
        name: Charge slot 1 target SOC
        description: Select the target-SOC entity for charge slot 1, in percent.
      charge_start_2:
        name: Charge slot 2 start
        description: Select the start-time entity for inverter charge slot 2.
      charge_end_2:
        name: Charge slot 2 end
        description: Select the end-time entity for inverter charge slot 2.
      charge_target_2:
        name: Charge slot 2 target SOC
        description: Select the target-SOC entity for charge slot 2, in percent.
      discharge_start_1:
        name: Discharge slot 1 start
        description: Select the start-time entity for inverter discharge slot 1.
      discharge_end_1:
        name: Discharge slot 1 end
        description: Select the end-time entity for inverter discharge slot 1.
      discharge_target_1:
        name: Discharge slot 1 target SOC
        description: Select the SOC floor entity for discharge slot 1, in percent.
      discharge_start_2:
        name: Discharge slot 2 start
        description: Select the start-time entity for inverter discharge slot 2.
      discharge_end_2:
        name: Discharge slot 2 end
        description: Select the end-time entity for inverter discharge slot 2.
      discharge_target_2:
        name: Discharge slot 2 target SOC
        description: Select the SOC floor entity for discharge slot 2, in percent.
  tariff:
    name: Electricity tariff
    description: Current and time-of-use import/export prices used to calculate cost and identify cheap charging periods.
    fields:
      import_current_rate:
        name: Current import rate
        description: Select the current electricity import-rate entity. The value should represent the current unit rate; p/kWh is preferred.
      export_current_rate:
        name: Current export rate
        description: Select the current electricity export-rate entity. The value should represent the current export payment; p/kWh is preferred.
      import_current_day_rates:
        name: Today's import rates
        description: Select the entity whose attributes provide today's timed import rates.
      import_next_day_rates:
        name: Tomorrow's import rates
        description: Select the entity whose attributes provide tomorrow's timed import rates.
      manual_import_overrides_entity:
        name: Manual import-price overrides
        description: Optional Home Assistant sensor whose windows attribute lists dated import-price overrides. These change forecast prices only, not the regular overnight charging window.
      export_current_day_rates:
        name: Today's export rates
        description: Select the entity whose attributes provide today's timed export rates.
      export_next_day_rates:
        name: Tomorrow's export rates
        description: Select the entity whose attributes provide tomorrow's timed export rates.
  solar:
    name: Solar PV
    description: Solar generation history and Solcast forecast entities used by the whole-home forecast.
    fields:
      energy_total_kwh:
        name: Solar generation energy total
        description: Select the cumulative PV generation sensor in kWh. It must increase over time.
      solcast_today:
        name: Solcast today
        description: Select the Solcast forecast entity for today.
      solcast_tomorrow:
        name: Solcast tomorrow
        description: Select the Solcast forecast entity for tomorrow.
      solcast_day_3:
        name: Solcast day 3
        description: Optional Solcast day-3 forecast used as a gap-filler when nearer forecast data is incomplete.
  heat_pump:
    name: Heat pump - space heating
    description: Entities used to learn and forecast central-heating electrical demand.
    fields:
      ch_energy_total_kwh:
        name: CH energy total
        description: Select the cumulative heat-pump electrical energy sensor for central/space heating only, in kWh.
      outdoor_temperature:
        name: Outdoor temperature
        description: Select the outdoor-air temperature sensor that best represents conditions seen by the building, ideally the heat pump external sensor.
      weather:
        name: Weather forecast
        description: Select a Home Assistant weather entity that provides forecast outdoor temperatures.
      summer_mode_off:
        name: Summer mode off threshold
        description: Select the heat-pump/controller entity containing the temperature below which summer mode is cancelled and space heating can resume.
      summer_mode_on:
        name: Summer mode on threshold
        description: Select the heat-pump/controller entity containing the temperature above which summer mode becomes active and normal space heating is suppressed.
  dhw:
    name: Domestic hot water
    description: Hot-water energy, tank-temperature and schedule inputs used by the DHW thermal forecast.
    fields:
      energy_total_kwh:
        name: DHW energy total
        description: Select the cumulative heat-pump electrical energy sensor for domestic hot water only, in kWh.
      mode:
        name: DHW mode
        description: Select the entity that reports the current DHW operating mode, such as Off, On or Schedule.
      tank_temperature:
        name: DHW tank temperature
        description: Select the main hot-water cylinder temperature sensor in °C.
      tank_upper_temperature:
        name: Upper tank temperature
        description: Optional upper-cylinder temperature sensor in °C. Configure this when you have separate upper and lower probes.
      tank_lower_temperature:
        name: Lower tank temperature
        description: Optional lower-cylinder temperature sensor in °C. Configure this when you have separate upper and lower probes.
      ambient_temperature:
        name: Tank ambient temperature
        description: Optional temperature sensor for the air around the cylinder in °C. It can improve standing-loss modelling.
      target_temperature:
        name: DHW target temperature
        description: Select the entity containing the configured DHW target temperature in °C.
      hysteresis:
        name: DHW hysteresis
        description: Select the entity containing the DHW reheating hysteresis in °C.
      schedule_prefix:
        name: DHW schedule entity prefix
        description: Enter the common entity-ID prefix used by the DHW schedule entities. This is a prefix, not one complete entity ID.
  ev:
    name: EV Smart Charging
    description: Optional EV metering and supplier smart-charging inputs. Leave the entity fields blank if EV Smart Charging is not used.
    fields:
      energy_total_kwh:
        name: EV energy total
        description: Optional cumulative EV charger energy sensor in kWh. Use the dedicated charger or CT total so EV load can be separated from household load.
      smart_charging_dispatch:
        name: Smart charging dispatch
        description: Optional supplier integration entity containing planned and completed EV smart-charging dispatches.
      smart_charging_active:
        name: Smart charging active
        description: Optional entity that indicates an EV smart-charging slot is active now.
      smart_charging_enabled:
        name: Enable EV Smart Charging
        description: Enable use of EV Smart Charging inputs. Turn this off if you do not use supplier-controlled EV charging.

  axle:
    name: Axle VPP
    description: Optional Axle event adapter. Disable this section if you do not use the Axle VPP Home Assistant integration.
    fields:
      enabled:
        name: Enable Axle
        description: Enable reading Axle VPP event entities and publishing the package-owned Axle event sensor.
      start_time_entity:
        name: Axle start time
        description: Select the Axle integration entity containing the next event start time.
      end_time_entity:
        name: Axle end time
        description: Select the Axle integration entity containing the next event end time.
      import_export_entity:
        name: Axle event direction
        description: Select the Axle integration entity that identifies the event as import or export.
      window_state_entity:
        name: Axle event state
        description: Select the Axle integration entity describing whether the event is upcoming, active or otherwise unavailable.
      updated_at_entity:
        name: Axle updated time
        description: Select the Axle integration entity containing the most recent event-data update timestamp.
      publish_entity:
        name: Published Axle entity
        description: Entity ID used by Home Energy Manager for its normalised Axle event. Normally leave this at the default.
      poll_seconds:
        name: Axle poll interval
        description: Seconds between reads of the Axle integration entities.
  advanced:
    name: Advanced
    description: Advanced forecasting, learning and MQTT settings. Defaults are suitable for most installations.
    fields:
      home_forecaster:
        name: Home forecast
        description: Advanced settings for household-load learning and whole-home forecast updates.
        fields:
          history_days:
            name: History days
            description: Number of recent days used to learn the ordinary household load profile.
          day_of_week_weighting:
            name: Weight matching weekdays
            description: Give extra weight to historical samples from the same weekday as the day being forecast.
          same_weekday_weight:
            name: Same-weekday weight
            description: Weight multiplier applied to matching weekdays when weekday weighting is enabled.
          forecast_interval_minutes:
            name: Forecast update interval
            description: Minutes between normal Home Energy Forecast recalculations.
          charge_efficiency:
            name: Fallback charge efficiency
            description: Fallback battery charge efficiency from 0 to 1, used when learned data is unavailable.
          discharge_efficiency:
            name: Fallback discharge efficiency
            description: Fallback battery discharge efficiency from 0 to 1, used when learned data is unavailable.
          minimum_baseline_w:
            name: Minimum baseline load
            description: Minimum ordinary household load in watts used to prevent unrealistically low learned baseline demand.
          log_level:
            name: Home forecaster log level
            description: Use INFO for normal operation or DEBUG temporarily for detailed troubleshooting.
      ashp_forecaster:
        name: ASHP forecast
        description: Advanced space-heating and DHW learning thresholds and forecast timing.
        fields:
          base_temperature_c:
            name: Degree-day base temperature
            description: Heating-degree-day base temperature in °C used to relate outdoor temperature to space-heating demand.
          winter_mode_below_c:
            name: Fallback winter threshold
            description: Fallback outdoor temperature in °C below which space heating is considered active when controller thresholds cannot be read.
          summer_mode_above_c:
            name: Fallback summer threshold
            description: Fallback outdoor temperature in °C above which normal space heating is considered inactive when controller thresholds cannot be read.
          initial_kwh_per_degree_day:
            name: Initial kWh per degree day
            description: Starting CH electrical-energy estimate in kWh per heating degree day, used until enough history has been learned.
          training_days:
            name: CH training days
            description: Maximum recent-history window in days used for CH learning.
          minimum_daily_degree_days:
            name: Minimum daily degree days
            description: Minimum heating degree days required before a historical day is used for CH coefficient learning.
          minimum_daily_ch_kwh:
            name: Minimum daily CH energy
            description: Minimum central-heating electrical energy in kWh required before a day is treated as a valid heating day.
          forecast_hours:
            name: ASHP forecast horizon
            description: Number of hours of CH/DHW forecast to publish. Keep at least 48 hours for today/tomorrow planning.
          forecast_interval_minutes:
            name: ASHP forecast slot length
            description: Length of each published ASHP forecast slot in minutes.
          update_minutes:
            name: ASHP update interval
            description: Minutes between ASHP forecast recalculations.
          dhw_tank_volume_l:
            name: DHW tank volume
            description: Hot-water cylinder volume in litres used by the thermal model.
          dhw_min_usable_temperature_c:
            name: Minimum usable DHW temperature
            description: Temperature in °C below which stored hot water is treated as no longer usefully hot.
          dhw_thermal_sample_minutes:
            name: DHW thermal sample interval
            description: Minutes between internal DHW thermal-model samples.
          dhw_history_days:
            name: DHW history days
            description: Number of recent days used for DHW thermal and demand learning.
          dhw_activity_threshold_kwh:
            name: DHW activity threshold
            description: Minimum DHW electrical-energy increase in kWh that counts as meaningful heating activity.
      battery_learning:
        name: Battery learning
        description: Thresholds controlling battery efficiency and idle-loss observations.
        fields:
          battery_idle_threshold_w:
            name: Battery idle threshold
            description: Maximum absolute battery power in watts considered idle for learning purposes.
          battery_efficiency_history_days:
            name: Efficiency history days
            description: Number of recent days retained for battery charge/discharge efficiency learning.
          battery_efficiency_min_session_kwh:
            name: Minimum efficiency session
            description: Minimum energy in kWh required before a charge/discharge session is accepted for efficiency learning.
          battery_efficiency_min_samples:
            name: Minimum efficiency samples
            description: Minimum accepted session count required before learned battery efficiency is considered usable.
          battery_idle_history_days:
            name: Idle history days
            description: Number of recent days retained for battery idle-loss learning.
          battery_idle_min_samples:
            name: Minimum idle samples
            description: Minimum accepted idle observations required before an idle-loss estimate is considered usable.
          battery_idle_soc_delta_pct:
            name: Maximum idle SOC movement
            description: Maximum SOC change in percentage points allowed during an observation that is treated as battery idle.
          battery_efficiency_publish_entity:
            name: Battery efficiency entity
            description: Entity ID used to publish the learned battery-efficiency summary. Normally leave this at the default.
      mqtt:
        name: MQTT
        description: MQTT Discovery transport for Home Energy Manager entities. Leave defaults when using the Home Assistant MQTT service.
        fields:
          enabled:
            name: Enable MQTT
            description: Enable MQTT Discovery publishing. If unavailable, components can fall back to Home Assistant REST state publishing.
          auto_discover_broker:
            name: Auto-discover broker
            description: Use the Home Assistant Supervisor MQTT service details automatically when available.
          host:
            name: MQTT host
            description: Optional broker host. Leave blank when broker auto-discovery is enabled.
          port:
            name: MQTT port
            description: MQTT broker port. The usual non-TLS default is 1883.
          username:
            name: MQTT username
            description: Optional broker username. Leave blank when Supervisor service discovery supplies credentials.
          password:
            name: MQTT password
            description: Optional broker password. Leave blank when Supervisor service discovery supplies credentials.
          ssl:
            name: MQTT TLS
            description: Enable TLS/SSL for the MQTT connection when required by the broker.
          discovery_prefix:
            name: Discovery prefix
            description: Home Assistant MQTT Discovery prefix. Normally leave this as homeassistant.
          topic_prefix:
            name: Topic prefix
            description: Base MQTT topic used by Home Energy Manager. Normally leave this as home_energy_manager.
          migrate_legacy_states:
            name: Clean obsolete MQTT identities
            description: Allow cleanup of obsolete Home Energy Manager discovery/state identities when publishing current entities.
