name: Home Energy Manager
version: 0.1.57
slug: home_energy_manager
description: ASHP forecasting, whole-home energy forecasting, Axle event integration and battery control in one add-on, with components kept strictly separate.
arch: [aarch64, amd64, armhf, armv7, i386]
startup: application
boot: auto
init: false
homeassistant_api: true
hassio_api: true
hassio_role: default
services:
- mqtt:want
map:
- config:rw
options:
  mqtt:
    enabled: true
    auto_discover_broker: true
    host: ''
    port: 1883
    username: ''
    password: ''
    ssl: false
    discovery_prefix: homeassistant
    topic_prefix: home_energy_manager
    migrate_legacy_states: true
  ashp_forecaster:
    ch_energy_entity: sensor.ashp_electrical_energy_ch
    outdoor_temperature_entity: sensor.ecomax360i_outdoor_temperature
    weather_entity: weather.forecast_home
    base_temperature_c: 15.5
    summer_mode_off_entity: number.ecomax360i_summer_mode_off
    summer_mode_on_entity: number.ecomax360i_summer_mode_on
    winter_mode_below_c: 11.0
    summer_mode_above_c: 12.0
    initial_kwh_per_degree_day: 1.55
    training_days: 30
    minimum_daily_degree_days: 2.0
    minimum_daily_ch_kwh: 2.0
    forecast_hours: 48
    forecast_interval_minutes: 30
    update_minutes: 15
    dhw_energy_entity: sensor.ashp_electrical_energy_dhw
    dhw_mode_entity: select.dhw_mode
    dhw_tank_temperature_entity: sensor.dhw_temperature
    dhw_tank_upper_temperature_entity: ''
    dhw_tank_lower_temperature_entity: ''
    dhw_tank_volume_l: 250
    dhw_ambient_temperature_entity: ''
    dhw_min_usable_temperature_c: 40.0
    dhw_thermal_sample_minutes: 5
    dhw_target_temperature_entity: number.dhw_target_temperature
    dhw_hysteresis_entity: number.dhw_hysteresis
    dhw_schedule_prefix: number.dhw_dhw_schedule_
    dhw_history_days: 28
    dhw_activity_threshold_kwh: 0.2
  home_forecaster:
    settings:
      timezone: Europe/London
      history_days: 28
      day_of_week_weighting: true
      same_weekday_weight: 1.5
      forecast_interval_minutes: 5
      controller_refresh_request_entity: sensor.home_energy_forecast_refresh_request
      charge_efficiency: 0.95
      discharge_efficiency: 0.95
      minimum_baseline_w: 200
      log_level: INFO
    battery:
      soc: ''
      capacity_kwh: ''
      reserve_soc: ''
      inverter_max_rate_w: ''
      charge_rate_w: ''
      discharge_rate_w: ''
      eco_mode: ''
      charge_schedule_enabled: ''
      discharge_schedule_enabled: ''
      pause_mode: ''
      charge_slot_1_start: ''
      charge_slot_1_end: ''
      charge_slot_1_target: ''
      discharge_slot_1_start: ''
      discharge_slot_1_end: ''
      discharge_slot_1_target: ''
    grid:
      power_w: ''
      import_energy_kwh: ''
      export_energy_kwh: ''
      import_rate: ''
      export_rate: ''
    load:
      power_w: ''
      energy_kwh: ''
    pv:
      power_w: ''
      energy_kwh: ''
      forecast_today: ''
      forecast_tomorrow: ''
      forecast_day3: ''
    ev:
      energy_kwh: ''
      smart_charging_enabled: true
      active_entity: ''
      dispatch_entity: ''
    ashp:
      forecast_entity: sensor.ashp_energy_forecast
    dhw:
      mode_entity: select.dhw_mode
      temperature_entity: sensor.dhw_temperature
      target_temperature_entity: number.dhw_target_temperature
      hysteresis_entity: number.dhw_hysteresis
      schedule_prefix: number.dhw_dhw_schedule_
  controller:
    operation_mode: forecast_only
    timezone: Europe/London
    home_energy_forecast_entity: sensor.home_energy_forecast
    status_entity_id: sensor.home_energy_controller
    sample_interval_seconds: 30
    forecast_stale_minutes: 15
    future_tolerance_minutes: 2
    controller_refresh_timeout_seconds: 30
    safety_buffer_soc: 20
    minimise_export_min_soc: 25
    preferred_charge_c_rate: 0.25
    export_start_time: '20:00'
    export_generated_solar_threshold_w: 200
    ev_smart_charging_enabled: true
    ev_smart_charging_active_entity: ''
    ev_smart_charging_dispatch_entity: ''
    axle_entity: sensor.home_energy_manager_axle
    axle_discharge_efficiency: 0.95
    axle_charge_margin_minutes: 10
    power_down_enabled: false
    power_down_event_entity: ''
    power_down_import_baseline_entity: ''
    power_down_export_baseline_entity: ''
    calibration_enabled: true
    top_full_every_days: 14
    deep_cycle_every_days: 60
    deep_cycle_floor_soc: 4
    reserve_dwell_minutes: 30
schema:
  mqtt:
    enabled: bool
    auto_discover_broker: bool
    host: str
    port: port
    username: str
    password: password
    ssl: bool
    discovery_prefix: str
    topic_prefix: str
    migrate_legacy_states: bool
  ashp_forecaster:
    ch_energy_entity: str
    outdoor_temperature_entity: str
    weather_entity: str
    base_temperature_c: float
    summer_mode_off_entity: str
    summer_mode_on_entity: str
    winter_mode_below_c: float
    summer_mode_above_c: float
    initial_kwh_per_degree_day: float
    training_days: int
    minimum_daily_degree_days: float
    minimum_daily_ch_kwh: float
    forecast_hours: int
    forecast_interval_minutes: int
    update_minutes: int
    dhw_energy_entity: str
    dhw_mode_entity: str
    dhw_tank_temperature_entity: str
    dhw_tank_upper_temperature_entity: str
    dhw_tank_lower_temperature_entity: str
    dhw_tank_volume_l: float
    dhw_ambient_temperature_entity: str
    dhw_min_usable_temperature_c: float
    dhw_thermal_sample_minutes: int
    dhw_target_temperature_entity: str
    dhw_hysteresis_entity: str
    dhw_schedule_prefix: str
    dhw_history_days: int
    dhw_activity_threshold_kwh: float
  home_forecaster:
    settings:
      timezone: str
      history_days: int
      day_of_week_weighting: bool
      same_weekday_weight: float
      forecast_interval_minutes: int
      controller_refresh_request_entity: str
      charge_efficiency: float
      discharge_efficiency: float
      minimum_baseline_w: float
      log_level: list(INFO|DEBUG|WARNING|ERROR)
    battery:
      soc: str
      capacity_kwh: str
      reserve_soc: str
      inverter_max_rate_w: str
      charge_rate_w: str
      discharge_rate_w: str
      eco_mode: str
      charge_schedule_enabled: str
      discharge_schedule_enabled: str
      pause_mode: str
      charge_slot_1_start: str
      charge_slot_1_end: str
      charge_slot_1_target: str
      discharge_slot_1_start: str
      discharge_slot_1_end: str
      discharge_slot_1_target: str
    grid:
      power_w: str
      import_energy_kwh: str
      export_energy_kwh: str
      import_rate: str
      export_rate: str
    load:
      power_w: str
      energy_kwh: str
    pv:
      power_w: str
      energy_kwh: str
      forecast_today: str
      forecast_tomorrow: str
      forecast_day3: str
    ev:
      energy_kwh: str
      smart_charging_enabled: bool
      active_entity: str
      dispatch_entity: str
    ashp:
      forecast_entity: str
    dhw:
      mode_entity: str
      temperature_entity: str
      target_temperature_entity: str
      hysteresis_entity: str
      schedule_prefix: str
  controller:
    operation_mode: list(forecast_only|maximise_export|minimise_export|export_generated|axle_only)
    timezone: str
    home_energy_forecast_entity: str
    status_entity_id: str
    sample_interval_seconds: int
    forecast_stale_minutes: int
    future_tolerance_minutes: int
    controller_refresh_timeout_seconds: int
    safety_buffer_soc: int
    minimise_export_min_soc: int
    preferred_charge_c_rate: float
    export_start_time: str
    export_generated_solar_threshold_w: float
    ev_smart_charging_enabled: bool
    ev_smart_charging_active_entity: str
    ev_smart_charging_dispatch_entity: str
    axle_entity: str
    axle_discharge_efficiency: float
    axle_charge_margin_minutes: int
    power_down_enabled: bool
    power_down_event_entity: str
    power_down_import_baseline_entity: str
    power_down_export_baseline_entity: str
    calibration_enabled: bool
    top_full_every_days: int
    deep_cycle_every_days: int
    deep_cycle_floor_soc: int
    reserve_dwell_minutes: int
