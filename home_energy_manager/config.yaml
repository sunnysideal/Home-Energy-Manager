name: Home Energy Manager
version: 0.1.42
slug: home_energy_manager
description: ASHP forecasting, whole-home energy forecasting and battery control in one add-on, with components kept strictly
  separate.
arch:
- aarch64
- amd64
- armhf
- armv7
- i386
startup: application
boot: auto
init: false
homeassistant_api: true
hassio_api: true
hassio_role: default
services:
- mqtt:want
map:
- config:rw
options:
  mqtt:
    enabled: true
    auto_discover_broker: true
    host: ''
    port: 1883
    username: ''
    password: ''
    ssl: false
  ashp_forecaster:
    ch_energy_entity: sensor.ashp_electrical_energy_ch
    dhw_energy_entity: sensor.ashp_electrical_energy_dhw
    outdoor_temperature_entity: sensor.ecomax360i_outdoor_temperature
    weather_entity: weather.forecast_home
    summer_mode_off_entity: number.ecomax360i_summer_mode_off
    summer_mode_on_entity: number.ecomax360i_summer_mode_on
    winter_mode_below_c: 11
    summer_mode_above_c: 12
    base_temperature_c: 15.5
    initial_kwh_per_degree_day: 1.55
    training_days: 30
    minimum_daily_degree_days: 2
    minimum_daily_ch_kwh: 2
    update_minutes: 15
    forecast_hours: 48
    dhw_mode_entity: select.dhw_mode
    dhw_tank_temperature_entity: sensor.dhw_temperature
    dhw_target_temperature_entity: number.dhw_target_temperature
    dhw_hysteresis_entity: number.dhw_hysteresis
    dhw_schedule_prefix: number.dhw_dhw_schedule_
    dhw_priority: true
    dhw_tank_upper_temperature_entity: ''
    dhw_tank_lower_temperature_entity: ''
    dhw_ambient_temperature_entity: ''
    dhw_tank_volume_l: 250
    dhw_min_usable_temperature_c: 40
    dhw_activity_threshold_kwh: 0.2
  home_forecaster:
    battery_soc_entity: ''
    battery_capacity_kwh: 13.5
    battery_reserve_entity: ''
    battery_charge_enable_entity: ''
    battery_discharge_enable_entity: ''
    battery_charge_rate_entity: ''
    battery_discharge_rate_entity: ''
    battery_charge_slot_1_start_entity: ''
    battery_charge_slot_1_end_entity: ''
    battery_charge_slot_1_target_soc_entity: ''
    battery_charge_slot_2_start_entity: ''
    battery_charge_slot_2_end_entity: ''
    battery_charge_slot_2_target_soc_entity: ''
    battery_discharge_slot_1_start_entity: ''
    battery_discharge_slot_1_end_entity: ''
    battery_discharge_slot_1_target_soc_entity: ''
    battery_discharge_slot_2_start_entity: ''
    battery_discharge_slot_2_end_entity: ''
    battery_discharge_slot_2_target_soc_entity: ''
    grid_power_entity: ''
    load_power_entity: ''
    pv_power_entity: ''
    grid_import_energy_entity: ''
    grid_export_energy_entity: ''
    load_energy_entity: ''
    pv_energy_entity: ''
    utility_import_energy_entity: ''
    utility_export_energy_entity: ''
    ev_energy_entity: ''
    pv_forecast_today_entity: ''
    pv_forecast_tomorrow_entity: ''
    pv_forecast_day3_entity: ''
    import_rate_entity: ''
    export_rate_entity: ''
    intelligent_dispatches_entity: ''
    min_house_load_w: 200
    update_minutes: 5
    learning_days: 28
    correction_hours: 2
    dhw_schedule_am_start: ''
    dhw_schedule_am_end: ''
    dhw_schedule_pm_start: ''
    dhw_schedule_pm_end: ''
    ashp_forecast_entity: sensor.ashp_forecast_next_48h
    export_limit_w: 6000
    import_limit_w: 6000
  controller:
    operation_mode: forecast_only
    forecast_entity: sensor.home_energy_forecast
    forecast_refresh_entity: ''
    forecast_refresh_timeout_seconds: 90
    forecast_refresh_poll_seconds: 5
    battery_soc_entity: ''
    battery_reserve_entity: ''
    battery_charge_enable_entity: ''
    battery_discharge_enable_entity: ''
    battery_charge_rate_entity: ''
    battery_discharge_rate_entity: ''
    battery_charge_slot_1_start_entity: ''
    battery_charge_slot_1_end_entity: ''
    battery_charge_slot_1_target_soc_entity: ''
    battery_charge_slot_2_start_entity: ''
    battery_charge_slot_2_end_entity: ''
    battery_charge_slot_2_target_soc_entity: ''
    battery_discharge_slot_1_start_entity: ''
    battery_discharge_slot_1_end_entity: ''
    battery_discharge_slot_1_target_soc_entity: ''
    battery_discharge_slot_2_start_entity: ''
    battery_discharge_slot_2_end_entity: ''
    battery_discharge_slot_2_target_soc_entity: ''
    eco_mode_entity: ''
    pause_charge_entity: ''
    pause_discharge_entity: ''
    import_rate_entity: ''
    export_rate_entity: ''
    intelligent_dispatches_entity: ''
    pv_generation_today_entity: ''
    grid_export_today_entity: ''
    battery_capacity_kwh: 13.5
    charge_efficiency: 0.91
    discharge_efficiency: 0.91
    guardrail_soc_percent: 20
    export_generated_solar_threshold_w: 100
    update_seconds: 60
