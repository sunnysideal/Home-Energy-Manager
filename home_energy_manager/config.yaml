name: Home Energy Manager
version: 0.1.55
slug: home_energy_manager
description: ASHP forecasting, whole-home energy forecasting, Axle event integration and battery control in one add-on, with components kept strictly separate.
arch: [aarch64, amd64, armhf, armv7, i386]
startup: application
boot: auto
init: false
homeassistant_api: true
hassio_api: true
hassio_role: default
services:
  - mqtt:need
map:
  - addon_config:rw
options:
  timezone: Europe/London
  ashp_forecaster:
    ch_energy_entity: sensor.ashp_electrical_energy_ch
    dhw_energy_entity: sensor.ashp_electrical_energy_dhw
    outdoor_temperature_entity: sensor.ecomax360i_outdoor_temperature
    weather_entity: weather.forecast_home
    summer_mode_off_entity: number.ecomax360i_summer_mode_off
    summer_mode_on_entity: number.ecomax360i_summer_mode_on
    dhw_mode_entity: select.dhw_mode
    dhw_temperature_entity: sensor.dhw_temperature
    dhw_upper_temperature_entity: ""
    dhw_lower_temperature_entity: sensor.dhw_temperature
    dhw_target_temperature_entity: number.dhw_target_temperature
    dhw_hysteresis_entity: number.dhw_hysteresis
    dhw_schedule_entity_prefix: number.dhw_dhw_schedule
    dhw_target_sensor: lower
    dhw_tank_volume_l: 250
    dhw_ambient_temperature_entity: ""
    dhw_history_days: 28
    winter_mode_below_c: 11
    summer_mode_above_c: 12
    base_temperature_c: 15.5
    initial_kwh_per_degree_day: 1.55
    training_days: 30
    minimum_daily_degree_days: 2
    minimum_daily_ch_kwh: 2
  home_forecaster:
    battery_soc_entity: ""
    battery_capacity_entity: ""
    battery_reserve_entity: ""
    battery_charge_rate_entity: ""
    battery_discharge_rate_entity: ""
    inverter_max_rate_entity: ""
    eco_mode_entity: ""
    charge_enable_entity: ""
    discharge_enable_entity: ""
    charge_slot_1_start_entity: ""
    charge_slot_1_end_entity: ""
    charge_slot_1_target_entity: ""
    charge_slot_2_start_entity: ""
    charge_slot_2_end_entity: ""
    charge_slot_2_target_entity: ""
    discharge_slot_1_start_entity: ""
    discharge_slot_1_end_entity: ""
    discharge_slot_1_target_entity: ""
    discharge_slot_2_start_entity: ""
    discharge_slot_2_end_entity: ""
    discharge_slot_2_target_entity: ""
    pause_mode_entity: ""
    grid_import_power_entity: ""
    grid_export_power_entity: ""
    grid_import_energy_entity: ""
    grid_export_energy_entity: ""
    house_load_power_entity: sensor.house_load
    pv_power_entity: ""
    pv_energy_entity: ""
    solcast_today_entity: ""
    solcast_tomorrow_entity: ""
    solcast_day3_entity: ""
    import_rate_entity: ""
    export_rate_entity: ""
    ev_energy_entity: ""
    ev_smart_charging_entity: ""
    ev_smart_dispatches_entity: ""
    min_load_w: 200
    battery_charge_efficiency: 0.91
    battery_discharge_efficiency: 0.91
    battery_idle_power_w: 0
    forecast_entity: sensor.home_energy_forecast
    forecast_refresh_request_entity: input_text.home_energy_forecast_refresh_request
  axle:
    start_time_entity: sensor.axle_vpp_axle_start_time
    end_time_entity: sensor.axle_vpp_axle_end_time
    import_export_entity: sensor.axle_vpp_axle_import_export
    event_window_state_entity: sensor.axle_vpp_axle_event_window_state
    updated_at_entity: sensor.axle_vpp_axle_updated_at
    publish_entity: sensor.home_energy_manager_axle
    poll_seconds: 30
  controller:
    operation_mode: forecast_only
    forecast_entity: sensor.home_energy_forecast
    axle_entity: sensor.home_energy_manager_axle
    battery_soc_entity: ""
    battery_capacity_entity: ""
    battery_reserve_entity: ""
    battery_charge_rate_entity: ""
    battery_discharge_rate_entity: ""
    inverter_max_rate_entity: ""
    eco_mode_entity: ""
    charge_enable_entity: ""
    discharge_enable_entity: ""
    charge_slot_1_start_entity: ""
    charge_slot_1_end_entity: ""
    charge_slot_1_target_entity: ""
    charge_slot_2_start_entity: ""
    charge_slot_2_end_entity: ""
    charge_slot_2_target_entity: ""
    discharge_slot_1_start_entity: ""
    discharge_slot_1_end_entity: ""
    discharge_slot_1_target_entity: ""
    discharge_slot_2_start_entity: ""
    discharge_slot_2_end_entity: ""
    discharge_slot_2_target_entity: ""
    pause_mode_entity: ""
    grid_import_power_entity: ""
    grid_export_power_entity: ""
    pv_power_entity: ""
    pv_energy_entity: ""
    ev_smart_charging_entity: ""
    ev_smart_dispatches_entity: ""
    import_rate_entity: ""
    export_rate_entity: ""
    overnight_reserve_soc: 20
    export_generated_reserve_soc: 4
    export_generated_solar_threshold_w: 200
    axle_event_rate_per_kwh: 1.0
    forecast_refresh_request_entity: input_text.home_energy_forecast_refresh_request
