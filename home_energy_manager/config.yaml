name: Home Energy Manager
version: 0.1.82
slug: home_energy_manager
description: ASHP forecasting, whole-home energy forecasting, Axle event integration and battery control in one add-on, with components kept strictly separate.
arch: [aarch64, amd64]
image: ghcr.io/sunnysideal/home-energy-manager
startup: application
boot: auto
init: false
homeassistant_api: true
hassio_api: true
hassio_role: default
services:
- mqtt:want
map:
- addon_config:rw
options:
  battery:
    soc: sensor.givtcp_battery_soc
    capacity_kwh: sensor.givtcp_battery_capacity_kwh_calc
    reserve_soc: number.givtcp_battery_power_reserve
    inverter_max_rate_w: sensor.givtcp_invertor_max_bat_rate
    charge_rate_w: number.givtcp_battery_charge_rate
    discharge_rate_w: number.givtcp_battery_discharge_rate
    eco_mode: switch.givtcp_eco_mode
    charge_schedule_enabled: switch.givtcp_enable_charge_schedule
    discharge_schedule_enabled: switch.givtcp_enable_discharge_schedule
    pause_mode: select.givtcp_battery_pause_mode
    pause_start: select.givtcp_battery_pause_start_time_slot
    pause_end: select.givtcp_battery_pause_end_time_slot
    charge_start_1: select.givtcp_charge_start_time_slot_1
    charge_end_1: select.givtcp_charge_end_time_slot_1
    charge_target_1: number.givtcp_charge_target_soc_1
    charge_start_2: select.givtcp_charge_start_time_slot_2
    charge_end_2: select.givtcp_charge_end_time_slot_2
    charge_target_2: number.givtcp_charge_target_soc_2
    discharge_start_1: select.givtcp_discharge_start_time_slot_1
    discharge_end_1: select.givtcp_discharge_end_time_slot_1
    discharge_target_1: number.givtcp_discharge_target_soc_1
    discharge_start_2: select.givtcp_discharge_start_time_slot_2
    discharge_end_2: select.givtcp_discharge_end_time_slot_2
    discharge_target_2: number.givtcp_discharge_target_soc_2
  grid:
    import_energy: sensor.smart_meter_electricity_import
    export_energy: sensor.smart_meter_electricity_export
  inverter:
    import_energy: sensor.givtcp_import_energy_total
    export_energy: sensor.givtcp_export_energy_total
  tariff:
    import_rate: sensor.octopus_energy_electricity_current_rate
    export_rate: sensor.octopus_energy_electricity_export_current_rate
    import_rates: event.octopus_energy_electricity_current_day_rates
    export_rates: event.octopus_energy_electricity_export_current_day_rates
    cheap_start: '23:00'
    cheap_end: '06:00'
    cheap_rate_p_per_kwh: 6.99
    peak_rate_p_per_kwh: 31.1157
  solar:
    energy_total_kwh: sensor.solar_generation
    solcast_today: sensor.solcast_pv_forecast_forecast_today
    solcast_tomorrow: sensor.solcast_pv_forecast_forecast_tomorrow
    solcast_day_3: sensor.solcast_pv_forecast_forecast_day_3
  heat_pump:
    ch_energy_total_kwh: sensor.ashp_electrical_energy_ch
    dhw_energy_total_kwh: sensor.ashp_electrical_energy_dhw
    outdoor_temperature: sensor.ecomax360i_outdoor_temperature
    weather: weather.forecast_home
    summer_mode_off: number.ecomax360i_summer_mode_off
    summer_mode_on: number.ecomax360i_summer_mode_on
  dhw:
    mode: select.dhw_mode
    temperature: sensor.dhw_temperature
    target_temperature: number.dhw_target_temperature
    hysteresis: number.dhw_hysteresis
  ev:
    energy_total_kwh: ''
    smart_charging_entity: ''
  axle:
    enabled: false
    event_entity: ''
  energy_strategy:
    operation_mode: forecast_only
  advanced:
    timezone: Europe/London
    update_interval_minutes: 5
    forecast_horizon_hours: 48
schema:
  battery:
    soc: entity
    capacity_kwh: entity
    reserve_soc: entity
    inverter_max_rate_w: entity
    charge_rate_w: entity
    discharge_rate_w: entity
    eco_mode: entity
    charge_schedule_enabled: entity
    discharge_schedule_enabled: entity
    pause_mode: entity
    pause_start: entity
    pause_end: entity
    charge_start_1: entity
    charge_end_1: entity
    charge_target_1: entity
    charge_start_2: entity
    charge_end_2: entity
    charge_target_2: entity
    discharge_start_1: entity
    discharge_end_1: entity
    discharge_target_1: entity
    discharge_start_2: entity
    discharge_end_2: entity
    discharge_target_2: entity
  grid:
    import_energy: entity
    export_energy: entity
  inverter:
    import_energy: entity
    export_energy: entity
  tariff:
    import_rate: entity
    export_rate: entity
    import_rates: entity
    export_rates: entity
    cheap_start: str
    cheap_end: str
    cheap_rate_p_per_kwh: float
    peak_rate_p_per_kwh: float
  solar:
    energy_total_kwh: entity
    solcast_today: entity
    solcast_tomorrow: entity
    solcast_day_3: entity
  heat_pump:
    ch_energy_total_kwh: entity
    dhw_energy_total_kwh: entity
    outdoor_temperature: entity
    weather: entity
    summer_mode_off: entity
    summer_mode_on: entity
  dhw:
    mode: entity
    temperature: entity
    target_temperature: entity
    hysteresis: entity
  ev:
    energy_total_kwh: str?
    smart_charging_entity: str?
  axle:
    enabled: bool
    event_entity: str?
  energy_strategy:
    operation_mode: list(forecast_only|minimise_export|export_generated|maximise_export|axle_only)
  advanced:
    timezone: str
    update_interval_minutes: int
    forecast_horizon_hours: int