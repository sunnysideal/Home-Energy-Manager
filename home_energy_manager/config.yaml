name: Home Energy Manager
version: 0.1.61
slug: home_energy_manager
description: ASHP forecasting, whole-home energy forecasting, Axle event integration and battery control in one add-on, with components kept strictly separate.
arch: [aarch64, amd64, armhf, armv7, i386]
startup: application
boot: auto
init: false
homeassistant_api: true
hassio_api: true
hassio_role: default
services:
- mqtt:want
map:
- config:rw
options:
  battery:
    soc: ''
    capacity_kwh: ''
    reserve_soc: ''
    power_w: ''
    charge_energy_total_kwh: ''
    discharge_energy_total_kwh: ''
  grid:
    import_energy_total_kwh: ''
    export_energy_total_kwh: ''
  inverter:
    house_load_energy_total_kwh: ''
    import_energy_total_kwh: ''
    export_energy_total_kwh: ''
    max_rate_w: ''
    charge_rate_w: ''
    discharge_rate_w: ''
    eco_mode: ''
    charge_schedule_enabled: ''
    discharge_schedule_enabled: ''
    pause_mode: ''
    pause_start: ''
    pause_end: ''
    charge_start_1: ''
    charge_end_1: ''
    charge_target_1: ''
    charge_start_2: ''
    charge_end_2: ''
    charge_target_2: ''
    discharge_start_1: ''
    discharge_end_1: ''
    discharge_target_1: ''
    discharge_start_2: ''
    discharge_end_2: ''
    discharge_target_2: ''
  tariff:
    import_current_rate: ''
    export_current_rate: ''
    import_current_day_rates: ''
    import_next_day_rates: ''
    export_current_day_rates: ''
    export_next_day_rates: ''
  solar:
    energy_total_kwh: ''
    solcast_today: sensor.solcast_pv_forecast_forecast_today
    solcast_tomorrow: sensor.solcast_pv_forecast_forecast_tomorrow
    solcast_day_3: sensor.solcast_pv_forecast_forecast_day_3
  heat_pump:
    ch_energy_total_kwh: sensor.ashp_electrical_energy_ch
    outdoor_temperature: sensor.ecomax360i_outdoor_temperature
    weather: weather.forecast_home
    summer_mode_off: number.ecomax360i_summer_mode_off
    summer_mode_on: number.ecomax360i_summer_mode_on
  dhw:
    energy_total_kwh: sensor.ashp_electrical_energy_dhw
    mode: select.dhw_mode
    tank_temperature: sensor.dhw_temperature
    tank_upper_temperature: ''
    tank_lower_temperature: ''
    ambient_temperature: ''
    target_temperature: number.dhw_target_temperature
    hysteresis: number.dhw_hysteresis
    schedule_prefix: number.dhw_dhw_schedule_
  ev:
    energy_total_kwh: ''
    smart_charging_dispatch: ''
    smart_charging_active: ''
    smart_charging_enabled: true
  energy_strategy:
    operation_mode: forecast_only
    safety_buffer_soc: 20
    axle_entity: sensor.home_energy_manager_axle
    axle_discharge_efficiency: 0.95
    axle_charge_margin_minutes: 10
    power_down_enabled: true
    power_down_events_entity: ''
    power_down_import_baseline_entity: ''
    power_down_export_baseline_entity: ''
    minimise_export_min_soc: 25
    calibration_enabled: true
    top_full_every_days: 14
    deep_cycle_every_days: 60
    deep_cycle_floor_soc: 4
    reserve_dwell_minutes: 30
    export_start: '20:00'
    preferred_charge_c_rate: 0.25
    max_charge_c_rate: 0.4
    discharge_rate_w: 0
    charge_safety_margin_minutes: 10
    generic_dwell_minutes: 15
    forecast_stale_minutes: 15
    future_tolerance_minutes: 2
    time_deadband_minutes: 3
    rate_deadband_w: 100
    energy_deadband_kwh: 0.1
    charge_variance_threshold_kwh: 0.5
    export_variance_threshold_kwh: 0.2
    write_retry_attempts: 4
    write_retry_delay_seconds: 10
    sample_interval_seconds: 30
    rate_match_tolerance_pct: 5
    rate_match_tolerance_w: 100
    controller_refresh_timeout_seconds: 90
  axle:
    enabled: true
    start_time_entity: sensor.axle_vpp_axle_start_time
    end_time_entity: sensor.axle_vpp_axle_end_time
    import_export_entity: sensor.axle_vpp_axle_import_export
    window_state_entity: sensor.axle_vpp_axle_event_window_state
    updated_at_entity: sensor.axle_vpp_axle_updated_at
    publish_entity: sensor.home_energy_manager_axle
    poll_seconds: 30
  advanced:
    home_forecaster:
      history_days: 28
      day_of_week_weighting: true
      same_weekday_weight: 1.5
      forecast_interval_minutes: 5
      charge_efficiency: 0.95
      discharge_efficiency: 0.95
      minimum_baseline_w: 200
      log_level: INFO
    ashp_forecaster:
      base_temperature_c: 15.5
      winter_mode_below_c: 11.0
      summer_mode_above_c: 12.0
      initial_kwh_per_degree_day: 1.55
      training_days: 30
      minimum_daily_degree_days: 2.0
      minimum_daily_ch_kwh: 2.0
      forecast_hours: 48
      forecast_interval_minutes: 30
      update_minutes: 15
      dhw_tank_volume_l: 250
      dhw_min_usable_temperature_c: 40.0
      dhw_thermal_sample_minutes: 5
      dhw_history_days: 28
      dhw_activity_threshold_kwh: 0.2
    battery_learning:
      battery_idle_threshold_w: 75
      battery_efficiency_history_days: 28
      battery_efficiency_min_session_kwh: 0.25
      battery_efficiency_min_samples: 3
      battery_idle_history_days: 14
      battery_idle_min_samples: 12
      battery_idle_soc_delta_pct: 0.15
      battery_efficiency_publish_entity: sensor.home_energy_manager_battery_efficiency
    mqtt:
      enabled: true
      auto_discover_broker: true
      host: ''
      port: 1883
      username: ''
      password: ''
      ssl: false
      discovery_prefix: homeassistant
      topic_prefix: home_energy_manager
      migrate_legacy_states: true
schema:
  battery:
    soc: str?
    capacity_kwh: str?
    reserve_soc: str?
    power_w: str?
    charge_energy_total_kwh: str?
    discharge_energy_total_kwh: str?
  grid:
    import_energy_total_kwh: str?
    export_energy_total_kwh: str?
  inverter:
    house_load_energy_total_kwh: str?
    import_energy_total_kwh: str?
    export_energy_total_kwh: str?
    max_rate_w: str?
    charge_rate_w: str?
    discharge_rate_w: str?
    eco_mode: str?
    charge_schedule_enabled: str?
    discharge_schedule_enabled: str?
    pause_mode: str?
    pause_start: str?
    pause_end: str?
    charge_start_1: str?
    charge_end_1: str?
    charge_target_1: str?
    charge_start_2: str?
    charge_end_2: str?
    charge_target_2: str?
    discharge_start_1: str?
    discharge_end_1: str?
    discharge_target_1: str?
    discharge_start_2: str?
    discharge_end_2: str?
    discharge_target_2: str?
  tariff:
    import_current_rate: str?
    export_current_rate: str?
    import_current_day_rates: str?
    import_next_day_rates: str?
    export_current_day_rates: str?
    export_next_day_rates: str?
  solar:
    energy_total_kwh: str?
    solcast_today: str?
    solcast_tomorrow: str?
    solcast_day_3: str?
  heat_pump:
    ch_energy_total_kwh: str
    outdoor_temperature: str
    weather: str
    summer_mode_off: str
    summer_mode_on: str
  dhw:
    energy_total_kwh: str
    mode: str
    tank_temperature: str
    tank_upper_temperature: str?
    tank_lower_temperature: str?
    ambient_temperature: str?
    target_temperature: str
    hysteresis: str
    schedule_prefix: str
  ev:
    energy_total_kwh: str?
    smart_charging_dispatch: str?
    smart_charging_active: str?
    smart_charging_enabled: bool
  energy_strategy:
    operation_mode: list(maximise_export|minimise_export|export_generated|forecast_only|axle_only)
    safety_buffer_soc: int(1,99)
    axle_entity: str
    axle_discharge_efficiency: float(0.5,1.0)
    axle_charge_margin_minutes: int(0,120)
    power_down_enabled: bool
    power_down_events_entity: str?
    power_down_import_baseline_entity: str?
    power_down_export_baseline_entity: str?
    minimise_export_min_soc: int(1,99)
    calibration_enabled: bool
    top_full_every_days: int(1,365)
    deep_cycle_every_days: int(1,730)
    deep_cycle_floor_soc: int(1,20)
    reserve_dwell_minutes: int(0,180)
    export_start: str
    preferred_charge_c_rate: float
    max_charge_c_rate: float
    discharge_rate_w: int(0,20000)
    charge_safety_margin_minutes: int(0,120)
    generic_dwell_minutes: int(0,120)
    forecast_stale_minutes: int(1,120)
    future_tolerance_minutes: int(0,30)
    time_deadband_minutes: int(0,30)
    rate_deadband_w: int(0,2000)
    energy_deadband_kwh: float
    charge_variance_threshold_kwh: float
    export_variance_threshold_kwh: float
    write_retry_attempts: int(1,10)
    write_retry_delay_seconds: int(1,600)
    sample_interval_seconds: int(5,300)
    rate_match_tolerance_pct: float
    rate_match_tolerance_w: int
    controller_refresh_timeout_seconds: int(30,600)
  axle:
    enabled: bool
    start_time_entity: str
    end_time_entity: str
    import_export_entity: str
    window_state_entity: str
    updated_at_entity: str
    publish_entity: str
    poll_seconds: int(10,300)
  advanced:
    home_forecaster:
      history_days: int(7,90)
      day_of_week_weighting: bool
      same_weekday_weight: float(1.0,10.0)
      forecast_interval_minutes: int(1,60)
      charge_efficiency: float(0.5,1.0)
      discharge_efficiency: float(0.5,1.0)
      minimum_baseline_w: int(0,5000)
      log_level: list(INFO|DEBUG)
    ashp_forecaster:
      base_temperature_c: float
      winter_mode_below_c: float(-30,30)
      summer_mode_above_c: float(-30,30)
      initial_kwh_per_degree_day: float
      training_days: int(1,180)
      minimum_daily_degree_days: float(0,20)
      minimum_daily_ch_kwh: float(0,100)
      forecast_hours: int(1,168)
      forecast_interval_minutes: int(5,60)
      update_minutes: int(5,60)
      dhw_tank_volume_l: int(50,1000)
      dhw_min_usable_temperature_c: float(20,60)
      dhw_thermal_sample_minutes: int(1,60)
      dhw_history_days: int(7,90)
      dhw_activity_threshold_kwh: float(0,10)
    battery_learning:
      battery_idle_threshold_w: int(0,2000)
      battery_efficiency_history_days: int(1,180)
      battery_efficiency_min_session_kwh: float(0.01,20.0)
      battery_efficiency_min_samples: int(1,100)
      battery_idle_history_days: int(1,180)
      battery_idle_min_samples: int(1,500)
      battery_idle_soc_delta_pct: float(0.0,5.0)
      battery_efficiency_publish_entity: str
    mqtt:
      enabled: bool
      auto_discover_broker: bool
      host: str?
      port: int(1,65535)
      username: str?
      password: password?
      ssl: bool
      discovery_prefix: str
      topic_prefix: str
      migrate_legacy_states: bool
