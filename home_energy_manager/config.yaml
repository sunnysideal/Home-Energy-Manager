name: Home Energy Manager
version: 0.1.32
slug: home_energy_manager
description: ASHP forecasting, whole-home energy forecasting and battery control in one add-on, with components kept strictly
  separate.
arch:
- aarch64
- amd64
- armhf
- armv7
- i386
startup: application
boot: auto
init: false
map:
- config:rw
options:
  mqtt:
    enabled: true
    auto_discover_broker: true
    host: ''
    port: 1883
    username: ''
    password: ''
    ssl: false
    discovery_prefix: homeassistant
    topic_prefix: home_energy_manager
    migrate_legacy_states: true
  ashp_forecaster:
    ch_energy_entity: sensor.ashp_electrical_energy_ch
    outdoor_temperature_entity: sensor.ecomax360i_outdoor_temperature
    weather_entity: weather.forecast_home
    base_temperature_c: 15.5
    summer_mode_off_entity: number.ecomax360i_summer_mode_off
    summer_mode_on_entity: number.ecomax360i_summer_mode_on
    winter_mode_below_c: 11
    summer_mode_above_c: 12
    initial_kwh_per_degree_day: 1.55
    training_days: 30
    minimum_daily_degree_days: 2
    minimum_daily_ch_kwh: 2
    forecast_hours: 48
    forecast_interval_minutes: 30
    update_minutes: 15
    dhw_energy_entity: sensor.ashp_electrical_energy_dhw
    dhw_mode_entity: select.dhw_mode
    dhw_tank_temperature_entity: sensor.dhw_temperature
    dhw_tank_upper_temperature_entity: ''
    dhw_tank_lower_temperature_entity: ''
    dhw_tank_volume_l: 250
    dhw_ambient_temperature_entity: ''
    dhw_min_usable_temperature_c: 40
    dhw_thermal_sample_minutes: 5
    dhw_target_temperature_entity: number.dhw_target_temperature
    dhw_hysteresis_entity: number.dhw_hysteresis
    dhw_schedule_prefix: number.dhw_dhw_schedule_
    dhw_history_days: 28
    dhw_activity_threshold_kwh: 0.2
  home_forecaster:
    timezone: Europe/London
    history_days: 28
    day_of_week_weighting: true
    same_weekday_weight: 1.5
    forecast_interval_minutes: 5
    controller_refresh_request_entity: sensor.home_energy_forecast_refresh_request
    charge_efficiency: 0.95
    discharge_efficiency: 0.95
    minimum_baseline_w: 200
    log_level: INFO
    battery:
      soc: ''
      capacity_kwh: ''
      reserve_soc: ''
      inverter_max_rate_w: ''
      charge_rate_w: ''
      discharge_rate_w: ''
      eco_mode: ''
      charge_schedule_enabled: ''
      discharge_schedule_enabled: ''
      charge_start_1: ''
      charge_end_1: ''
      charge_target_soc_1: ''
      charge_start_2: ''
      charge_end_2: ''
      charge_target_soc_2: ''
      discharge_start_1: ''
      discharge_end_1: ''
      discharge_target_soc_1: ''
      discharge_start_2: ''
      discharge_end_2: ''
      discharge_target_soc_2: ''
      pause_mode: ''
      pause_start: ''
      pause_end: ''
      pause_discharge: ''
      charge_power_limit_w: ''
      discharge_power_limit_w: ''
      battery_power_w: ''
      battery_charge_energy_total_kwh: ''
      battery_discharge_energy_total_kwh: ''
      battery_idle_threshold_w: 75
      battery_efficiency_history_days: 28
      battery_efficiency_min_session_kwh: 0.25
      battery_efficiency_min_samples: 3
      battery_idle_history_days: 14
      battery_idle_min_samples: 12
      battery_idle_soc_delta_pct: 0.15
      battery_efficiency_publish_entity: sensor.home_energy_manager_battery_efficiency
    grid:
      power_w: ''
      import_energy_total_kwh: ''
      export_energy_total_kwh: ''
      inverter_import_energy_total_kwh: ''
      inverter_export_energy_total_kwh: ''
    load:
      power_w: ''
      energy_total_kwh: ''
      minimum_baseline_w: 200
    ev:
      energy_total_kwh: ''
      smart_charging_active_entity: ''
      smart_charging_dispatch_entity: ''
    pv:
      power_w: ''
      energy_total_kwh: ''
      solcast_today: ''
      solcast_tomorrow: ''
      solcast_day3: ''
    tariff:
      import_rate: ''
      export_rate: ''
    ashp:
      forecast_entity: sensor.ashp_forecast_next_48h
    output:
      forecast_entity: sensor.home_energy_manager_home_forecaster_home_energy_forecast
      forecast_alias_entity: sensor.home_energy_forecast
      summary_entity: sensor.home_energy_forecast_summary
      refresh_ack_entity: sensor.home_energy_forecast_refresh_ack
  controller:
    operation_mode: forecast_only
    forecast_entity: sensor.home_energy_forecast
    ev_smart_charging_enabled: false
    ev_smart_charging_dispatch_entity: ''
    ev_smart_charging_active_entity: ''
    import_rate_entity: ''
    export_rate_entity: ''
    soc_entity: ''
    reserve_soc_entity: ''
    charge_rate_entity: ''
    discharge_rate_entity: ''
    eco_mode_entity: ''
    charge_enable_entity: ''
    discharge_enable_entity: ''
    charge_start_1_entity: ''
    charge_end_1_entity: ''
    charge_target_soc_1_entity: ''
    charge_start_2_entity: ''
    charge_end_2_entity: ''
    charge_target_soc_2_entity: ''
    discharge_start_1_entity: ''
    discharge_end_1_entity: ''
    discharge_target_soc_1_entity: ''
    discharge_start_2_entity: ''
    discharge_end_2_entity: ''
    discharge_target_soc_2_entity: ''
    pause_mode_entity: ''
    pause_start_entity: ''
    pause_end_entity: ''
    pause_discharge_entity: ''
    refresh_request_entity: sensor.home_energy_forecast_refresh_request
    refresh_ack_entity: sensor.home_energy_forecast_refresh_ack
    forecast_only: false
    planning_guardrail_soc: 20
    export_generated_solar_threshold_w: 100
schema:
  mqtt:
    enabled: bool
    auto_discover_broker: bool
    host: str?
    port: port
    username: str?
    password: password?
    ssl: bool
    discovery_prefix: str
    topic_prefix: str
    migrate_legacy_states: bool
  ashp_forecaster:
    ch_energy_entity: str
    outdoor_temperature_entity: str
    weather_entity: str
    base_temperature_c: float
    summer_mode_off_entity: str
    summer_mode_on_entity: str
    winter_mode_below_c: float(-30,30)
    summer_mode_above_c: float(-30,30)
    initial_kwh_per_degree_day: float
    training_days: int(1,180)
    minimum_daily_degree_days: float(0,20)
